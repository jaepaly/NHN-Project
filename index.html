<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#06050a" />
    <meta name="description" content="정해진 스킬은 없다. 당신의 문장이 주문이 되는 로그라이크 액션 게임 INCANT." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="INCANT — 말이 곧 마법이 되는 로그라이크" />
    <meta property="og:description" content="정해진 스킬은 없다. 당신의 문장이 주문이 된다." />
    <meta property="og:image" content="https://jaepaly.github.io/NHN-Project/assets/og-incant.png" />

    <!-- 상대경로: %BASE_URL%는 dev 서버에서 base가 이중 적용되는 Vite quirk가 있어 회피 -->
    <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
    <title>INCANT — 말이 곧 마법이 되는 로그라이크</title>
    <style>
      /*
       * 영창 바 팔레트 — **`src/ui/uiTokens.ts`의 사본이다.**
       *
       * index.html은 정적 파일이라 TS 토큰을 가져올 수 없다. 그래서 여기 CSS 변수로
       * 두고, `ui-palette-regression`이 두 파일을 대조해 어긋나면 실패시킨다.
       * 사본을 두는 것 자체가 위험하지만, 대조 회귀가 있으면 조용히 갈리지는 않는다.
       *
       * ⚠️ 상태 색(--incant-dry·--incant-limit·--incant-over)은 마도서 톤으로 밀지
       * 않는다. 마나 부족·어휘제한·초과를 **색으로 구분**하는 정보이기 때문이다.
       * 색조는 지키고 채도만 낮춰 금색·양피지 화면에서 형광으로 튀지 않게 했다.
       */
      :root {
        --ui-bg: #06050a;
        --ui-panel: rgba(24, 17, 28, 0.985);
        --ui-panel-inset: rgba(14, 10, 18, 0.94);
        --ui-border: #4b3850;
        --ui-border-strong: #d8bb72;
        --ui-text-bright: #eadfc8;
        --ui-text: #d8cdb8;
        --ui-text-soft: #aaa1c8;
        --ui-text-muted: #8a7f96;
        --ui-accent: #d8bb72;
        --ui-accent-glow: #f0d79a;
        --ui-danger: #b95f72;
        /* 상태 색 — 정보다. 색조 유지 + 채도 하향 */
        --incant-dry: #b95f72;
        --incant-limit: #a888c4;
        --incant-limit-glow: #5f4a86;
        --incant-limit-accent: #ddd0e8;
        --incant-over: #c47690;
        --incant-over-glow: #8a4a68;
        --incant-over-accent: #e8d4dc;
      }
      html, body {
        margin: 0;
        padding: 0;
        background: var(--ui-bg);
        height: 100%;
        overflow: hidden;
        font-family: 'Segoe UI', 'Malgun Gothic', sans-serif;
        color: var(--ui-text);
      }
      #game-root {
        width: 100%;
        height: 100%;
      }
      /* 영창 차징 UX — 캔버스 위 DOM 오버레이 */
      #incant-wrap {
        --spell-core: var(--ui-accent);
        --spell-glow: var(--ui-accent-glow);
        --spell-accent: #ffffff;
        --charge: 0%;
        position: fixed;
        inset: 0;
        z-index: 10;
        display: grid;
        place-items: end center;
        padding-bottom: clamp(64px, 12vh, 110px);
        pointer-events: none;
        opacity: 0;
        visibility: hidden;
        transition: opacity 160ms ease;
      }
      #incant-wrap::before {
        content: '';
        position: absolute;
        inset: 0;
        background:
          radial-gradient(circle at 50% 66%, color-mix(in srgb, var(--spell-glow) 22%, transparent), transparent 34%),
          linear-gradient(to bottom, transparent 35%, rgba(6, 5, 10, 0.7));
        backdrop-filter: blur(1px) saturate(0.95);
      }
      #incant-wrap.active {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
      }
      .incant-panel {
        position: relative;
        width: min(650px, calc(100vw - 36px));
        padding: 18px 20px 16px;
        box-sizing: border-box;
        border: 1px solid color-mix(in srgb, var(--spell-core) 64%, transparent);
        border-radius: 16px;
        background: linear-gradient(145deg, var(--ui-panel), rgba(14, 10, 18, 0.96));
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.035) inset,
          0 0 32px color-mix(in srgb, var(--spell-glow) 36%, transparent),
          0 22px 70px rgba(0, 0, 0, 0.52);
        overflow: hidden;
      }
      .incant-panel::before {
        content: '';
        position: absolute;
        inset: -80% 38%;
        background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--spell-accent) 16%, transparent), transparent);
        transform: rotate(18deg);
        animation: incant-scan 2.8s linear infinite;
        pointer-events: none;
      }
      .incant-panel::after {
        content: '';
        position: absolute;
        inset: 5px;
        border: 1px solid transparent;
        border-radius: 11px;
        pointer-events: none;
      }
      .incant-heading,
      .incant-footer {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .incant-kicker {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.22em;
        color: var(--spell-core);
        text-shadow: 0 0 12px var(--spell-glow);
      }
      /*
       * 마나는 영창 결정의 **예산**이라 위계 최상단에 온다 (총괄 지적: 위계 정돈).
       * 종전에는 `시간 흐름 10% · 마나 37`처럼 연출 문구와 같은 줄·같은 크기에 묻혀 있었다.
       * 감당 가능한 대역이 하나도 없으면 통째로 붉어져 "지금은 못 쓴다"가 즉시 읽힌다.
       */
      #incant-state {
        font: 700 19px/1 'Consolas', monospace;
        letter-spacing: 0.04em;
        color: var(--spell-accent);
        text-shadow: 0 0 14px color-mix(in srgb, var(--spell-glow) 55%, transparent);
        white-space: nowrap;
      }
      #incant-wrap.mana-dry #incant-state {
        color: var(--incant-dry);
        text-shadow: 0 0 14px rgba(196, 118, 144, 0.5);
      }
      /*
       * 대역 칩 — "얼마나 큰 말을 쓸까"라는 이 창의 유일한 결정을 세 선택지로 세운다.
       * 감당 가능한 것만 밝다. 위력은 심판이 정하므로 제출 전에 알 수 없지만,
       * 내 마나와 가격표는 지금 확실히 아는 정보다 — 여기엔 추정이 들어가지 않는다.
       */
      .incant-bands {
        position: relative;
        display: flex;
        gap: 8px;
        margin: 13px 0 10px;
      }
      .incant-band {
        flex: 1;
        display: flex;
        align-items: baseline;
        justify-content: center;
        gap: 7px;
        padding: 8px 6px;
        border: 1px solid color-mix(in srgb, var(--spell-core) 34%, var(--ui-border));
        border-radius: 8px;
        background: rgba(14, 10, 18, 0.55);
        transition: opacity 140ms ease, border-color 140ms ease;
      }
      .incant-band-name {
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.04em;
        color: var(--ui-text);
      }
      .incant-band-cost {
        font: 600 11px/1 'Consolas', monospace;
        color: var(--spell-core);
      }
      .incant-band-hint {
        font-size: 10px;
        letter-spacing: 0.02em;
        color: var(--ui-text-muted);
      }
      /* 감당 못 하는 대역은 죽인다 — 고를 수 없는 선택지가 밝으면 결정이 흐려진다 */
      .incant-band.locked {
        opacity: 0.3;
        border-color: var(--ui-border);
      }
      .incant-band.locked .incant-band-cost { color: var(--ui-text-muted); }
      /* 지금 닿는 가장 큰 대역 — 하나만 테두리를 세워 "여기까지"를 표시한다 */
      .incant-band.reach {
        border-color: var(--spell-core);
        box-shadow: 0 0 16px color-mix(in srgb, var(--spell-glow) 26%, transparent);
      }
      .incant-ultimate-contract {
        position: relative;
        display: none;
        align-items: center;
        justify-content: space-between;
        margin: 11px 0 8px;
        padding: 7px 11px;
        border-top: 1px solid rgba(221, 185, 255, 0.18);
        border-bottom: 1px solid rgba(221, 185, 255, 0.18);
        background: linear-gradient(90deg, rgba(70, 36, 92, 0.22), transparent);
        font-size: 10px;
        letter-spacing: 0.04em;
        color: #bfa9cc;
      }
      .incant-ultimate-contract strong {
        font: 700 11px/1.1 'Consolas', monospace;
        color: #f3d58d;
        text-shadow: 0 0 12px rgba(238, 202, 116, 0.3);
      }
      #incant-ultimate-resonance {
        position: relative;
        display: none;
        margin: 1px 0 11px;
        padding: 7px 11px;
        border-left: 2px solid #d9aeff;
        background: linear-gradient(90deg, rgba(134, 64, 174, 0.17), transparent);
        color: #d8c5e6;
        font-size: 11px;
        letter-spacing: 0.035em;
      }
      /*
       * 첫 영창 안내 (총괄 지적: "영창하면 화면이 흐려져서 설명도 흐리게 보인다").
       *
       * 원인: 안내는 Phaser 배너(캔버스)로 뜨는데 영창 창은 캔버스 **위에** 덮이는 DOM
       * 오버레이라 어둠·블러가 통째로 걸린다. 하필 그 안내의 내용이 "ENTER를 눌러 이렇게
       * 쳐라"라서, **누르라는 대로 눌렀더니 읽어야 할 예시가 흐려지는** 구조였다.
       *
       * 해법: 안내를 지우는 대신 **입력창 안으로 옮긴다.** 무엇을 칠지 알려주는 글은
       * 치는 자리에 있어야 한다. 좌측 강조선 + 왼쪽 정렬 — 여러 줄의 시작점이 어긋나지
       * 않게(중앙 정렬 지적과 같은 규율).
       */
      .incant-guide {
        position: relative;
        margin-top: 12px;
        padding: 9px 12px;
        border-left: 2px solid var(--spell-core);
        border-radius: 0 7px 7px 0;
        background: color-mix(in srgb, var(--spell-glow) 11%, transparent);
        text-align: left;
      }
      .incant-guide[hidden] { display: none; }
      .incant-guide-title {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.06em;
        color: var(--spell-core);
      }
      .incant-guide-line {
        margin-top: 4px;
        font-size: 12.5px;
        line-height: 1.45;
        color: var(--ui-text-soft);
      }
      .incant-input-shell {
        position: relative;
        margin-top: 12px;
      }
      #incant-bar {
        width: 100%;
        box-sizing: border-box;
        padding: 15px 52px 15px 17px;
        font-size: clamp(17px, 2.2vw, 21px);
        font-weight: 600;
        letter-spacing: 0.02em;
        color: var(--ui-text-bright);
        background: rgba(10, 8, 15, 0.72);
        border: 1px solid color-mix(in srgb, var(--spell-core) 55%, var(--ui-border));
        border-radius: 9px;
        outline: none;
        box-shadow: inset 0 0 18px color-mix(in srgb, var(--spell-glow) 12%, transparent);
        caret-color: var(--spell-accent);
        transition: border-color 120ms ease, box-shadow 120ms ease;
      }
      #incant-bar:focus {
        border-color: var(--spell-core);
        box-shadow:
          inset 0 0 18px color-mix(in srgb, var(--spell-glow) 18%, transparent),
          0 0 20px color-mix(in srgb, var(--spell-glow) 28%, transparent);
      }
      #incant-count {
        position: absolute;
        right: 15px;
        top: 50%;
        transform: translateY(-50%);
        font: 600 11px/1 'Consolas', monospace;
        color: var(--ui-text-muted);
      }
      .incant-charge-track {
        position: relative;
        height: 6px;
        margin: 13px 1px 10px;
        border-radius: 999px;
        background: var(--ui-panel-inset);
        overflow: hidden;
      }
      #incant-charge {
        width: var(--charge);
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--spell-core), var(--spell-accent));
        box-shadow: 0 0 18px var(--spell-core);
        transition: width 120ms ease-out;
      }
      /*
       * 최하위 층 — 조작 안내와 연출 문구. 종전에는 비용 등급표와 같은 줄에 붙어 있어
       * "무엇을 고를까"와 "어떻게 제출할까"가 구분되지 않았다. 이제 대역 칩이 결정을
       * 맡으므로 여기는 한 번 배우면 다시 안 읽는 정보만 남는다.
       */
      #incant-hint,
      #incant-charge-label {
        font-size: 11px;
        letter-spacing: 0.02em;
        color: var(--ui-text-muted);
      }
      /*
       * 일반 방은 대역 칩을, 금언 저주 방은 게이지를 쓴다.
       * 금언에서는 비용(wordLimitCost)이 제출 전에 정확히 계산되므로 게이지가 정직하다 —
       * 길이로 위력을 추정하던 일반 방의 공명 게이지와는 다르다.
       */
      .incant-charge-track { display: none; }
      #incant-wrap.word-limit .incant-charge-track,
      #incant-wrap.judging .incant-charge-track { display: block; }
      #incant-wrap.word-limit .incant-bands,
      #incant-wrap.judging .incant-bands { display: none; }
      /*
       * 심사 중에는 게이지를 되살린다 — 여기서는 진행률이 아니라 **미결 상태**를 나르는
       * 불확정 표시라 정직하다(judging-charge는 좌우로 흐르지 채워지지 않는다). 제출한
       * 뒤 1~2초 동안 아무 반응이 없으면 플레이어는 입력이 먹혔는지 모른다.
       * 금언 방에서는 우측 문구가 언령 압축 상태를 나르므로 함께 올린다.
       */
      #incant-wrap.word-limit #incant-charge-label,
      #incant-wrap.judging #incant-charge-label {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.06em;
        color: var(--spell-core);
      }
      #incant-wrap.judging #incant-bar {
        color: var(--spell-core);
        border-color: var(--spell-core);
        animation: judging-input 800ms ease-in-out infinite alternate;
      }
      #incant-wrap.judging #incant-charge {
        width: 100%;
        animation: judging-charge 1.1s ease-in-out infinite;
      }
      #incant-wrap.judging .incant-panel {
        animation: judging-panel 1.1s ease-in-out infinite alternate;
      }
      #incant-wrap.word-limit {
        --spell-core: var(--incant-limit);
        --spell-glow: var(--incant-limit-glow);
        --spell-accent: var(--incant-limit-accent);
      }
      #incant-wrap.word-limit #incant-bar {
        padding-right: 132px;
      }
      #incant-wrap.word-limit::before {
        background:
          repeating-linear-gradient(90deg, transparent 0 9%, rgba(192, 132, 252, 0.025) 9.2% 9.35%, transparent 9.6% 18%),
          radial-gradient(circle at 50% 66%, rgba(95, 74, 134, 0.24), transparent 34%),
          linear-gradient(to bottom, transparent 35%, rgba(8, 6, 12, 0.78));
      }
      #incant-wrap.word-limit-over {
        --spell-core: var(--incant-over);
        --spell-glow: var(--incant-over-glow);
        --spell-accent: var(--incant-over-accent);
      }
      #incant-wrap.word-limit-over #incant-bar {
        border-color: var(--incant-over);
        box-shadow:
          inset 0 0 20px rgba(162, 28, 175, 0.3),
          0 0 22px rgba(255, 107, 157, 0.24);
      }
      #incant-wrap.word-limit-over #incant-count,
      #incant-wrap.word-limit-over #incant-charge-label {
        color: var(--incant-over-accent);
        text-shadow: 0 0 10px rgba(196, 118, 144, 0.55);
      }
      #incant-wrap.word-limit-blocked .incant-panel {
        animation: word-limit-block 260ms ease-out;
      }
      #incant-wrap.ultimate {
        --spell-core: #d9aeff;
        --spell-glow: rgba(154, 72, 208, 0.72);
        --spell-accent: #f3d58d;
      }
      #incant-wrap.ultimate::before {
        background:
          radial-gradient(circle at 50% 67%, rgba(154, 72, 208, 0.3), transparent 30%),
          radial-gradient(circle at 50% 67%, transparent 0 22%, rgba(230, 194, 112, 0.065) 22.4% 22.8%, transparent 23.2%),
          linear-gradient(to bottom, rgba(10, 5, 17, 0.08) 25%, rgba(7, 4, 12, 0.84));
        backdrop-filter: blur(2px) saturate(0.88);
      }
      #incant-wrap.ultimate .incant-panel {
        width: min(700px, calc(100vw - 36px));
        border-color: rgba(221, 174, 255, 0.82);
        background:
          radial-gradient(circle at 50% 0%, rgba(104, 42, 138, 0.26), transparent 48%),
          linear-gradient(145deg, rgba(27, 13, 36, 0.98), rgba(10, 7, 16, 0.98));
        box-shadow:
          0 0 0 1px rgba(244, 211, 132, 0.08) inset,
          0 0 44px rgba(132, 56, 180, 0.34),
          0 24px 80px rgba(0, 0, 0, 0.66);
      }
      #incant-wrap.ultimate .incant-panel::after {
        border-color: rgba(238, 202, 116, 0.2);
      }
      #incant-wrap.ultimate .incant-kicker {
        color: #f3d58d;
        letter-spacing: 0.28em;
      }
      #incant-wrap.ultimate .incant-bands { display: none; }
      #incant-wrap.ultimate .incant-ultimate-contract { display: flex; }
      #incant-wrap.ultimate #incant-ultimate-resonance { display: block; }
      #incant-wrap.ultimate .incant-charge-track { display: block; }
      #incant-wrap.ultimate #incant-charge {
        width: 100%;
        background: linear-gradient(90deg, #8d45ba, #d9aeff 58%, #f3d58d);
        animation: ultimate-charge 1.8s ease-in-out infinite alternate;
      }
      /* 복합 상태 우선순위: 판정 중 > 금언 제한/초과 > 필살영창 장식. */
      #incant-wrap.ultimate.word-limit {
        --spell-core: var(--incant-limit);
        --spell-glow: var(--incant-limit-glow);
        --spell-accent: var(--incant-limit-accent);
      }
      #incant-wrap.ultimate.word-limit-over {
        --spell-core: var(--incant-over);
        --spell-glow: var(--incant-over-glow);
        --spell-accent: var(--incant-over-accent);
      }
      #incant-wrap.ultimate.word-limit #incant-charge {
        width: var(--charge);
        background: linear-gradient(90deg, var(--spell-core), var(--spell-accent));
        animation: none;
      }
      #incant-wrap.ultimate.judging #incant-charge {
        width: 100%;
        background: linear-gradient(90deg, var(--spell-core), var(--spell-accent));
        animation: judging-charge 1.1s ease-in-out infinite;
      }
      #incant-wrap.ultimate.judging .incant-panel {
        animation: judging-panel 1.1s ease-in-out infinite alternate;
      }
      @keyframes incant-scan {
        from { transform: translateX(-220%) rotate(18deg); }
        to { transform: translateX(220%) rotate(18deg); }
      }
      @keyframes judging-input {
        to { box-shadow: inset 0 0 24px color-mix(in srgb, var(--spell-glow) 28%, transparent), 0 0 26px color-mix(in srgb, var(--spell-glow) 42%, transparent); }
      }
      @keyframes judging-charge {
        0%, 100% { transform: translateX(-24%); opacity: 0.6; }
        50% { transform: translateX(6%); opacity: 1; }
      }
      @keyframes judging-panel {
        to { border-color: var(--spell-accent); }
      }
      @keyframes word-limit-block {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-9px); }
        55% { transform: translateX(7px); }
        80% { transform: translateX(-3px); }
      }
      @keyframes ultimate-charge {
        from { opacity: 0.7; filter: brightness(0.88); }
        to { opacity: 1; filter: brightness(1.25); }
      }
      @media (prefers-reduced-motion: reduce) {
        .incant-panel::before,
        #incant-wrap.judging #incant-bar,
        #incant-wrap.judging #incant-charge,
        #incant-wrap.judging .incant-panel,
          #incant-wrap.word-limit-blocked .incant-panel { animation: none; }
        #incant-wrap.ultimate #incant-charge { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="game-root"></div>
    <div id="incant-wrap" aria-hidden="true">
      <div class="incant-panel">
        <div class="incant-heading">
          <span id="incant-kicker" class="incant-kicker">INCANTATION LINK</span>
          <span id="incant-state">마나 0</span>
        </div>
        <!-- 첫 영창 안내 — 배너 대신 여기서 읽힌다 (영창 창이 화면을 흐리므로) -->
        <div id="incant-guide" class="incant-guide" hidden></div>
        <div class="incant-input-shell">
          <input id="incant-bar" type="text" autocomplete="off" maxlength="60"
                 aria-label="자유 텍스트 주문"
                 placeholder="예: 거대한 화염구를 적에게 던진다" />
          <span id="incant-count">0/60</span>
        </div>
        <!-- 대역 칩 — 일반 방에서는 여기가, 금언 저주 방에서는 아래 게이지가 뜬다 -->
        <div id="incant-bands" class="incant-bands"></div>
        <div class="incant-ultimate-contract" aria-label="필살영창 자원 규칙">
          <span>마나 소모 없음</span>
          <strong>축적된 게이지 전량 소비</strong>
        </div>
        <div id="incant-ultimate-resonance"></div>
        <div class="incant-charge-track" aria-hidden="true">
          <div id="incant-charge"></div>
        </div>
        <div class="incant-footer">
          <span id="incant-hint">Enter 발동 · Esc 취소</span>
          <span id="incant-charge-label">시간 흐름 10%</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
